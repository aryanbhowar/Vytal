# Continuous integration: runs on every push and pull request to main.
# Python tests use the committed models and summaries; tests that need the
# (uncommitted) survey data skip themselves. Browser (Playwright) tests are run
# locally on Windows with Edge and are not part of CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Backend, ML and data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
            requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r ml/requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
